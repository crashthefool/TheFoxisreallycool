<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Fox's Board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Caveat+Brush&family=Metamorphous&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
/* colors: black, blue and red */
:root {
  --black: #0b0c18;
  --blue: #4a63ff;
  --red: #e8334a;
  --panel: #151933;
  --slip: #1d2347;
  --edge: #2f3b7a;
  --text: #eceaf6;
  /* paper grain, tiny svg noise so there's no image file to host */
  --grain: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .75  0 0 0 0 .8  0 0 0 0 1  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: radial-gradient(ellipse at 15% 0, #151a3d, transparent 60%), var(--black);
  color: #fff;
  font-family: Inter, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
.obs-mode { background: transparent !important }

/* setup screen */
#setup { display: flex; justify-content: center; align-items: center; height: 100% }
.box {
  width: 340px;
  padding: 30px 26px 26px;
  text-align: center;
  color: var(--text);
  border: 2px solid var(--blue);
  border-radius: 3px 7px 2px 8px;
  transform: rotate(-1deg);
  background: var(--grain), var(--panel);
  box-shadow: 3px 9px 20px rgba(0, 0, 0, .6);
}
.box h3 { font-family: Metamorphous, serif; font-weight: 400; color: var(--red); font-size: 25px }
.box input { width: 100%; padding: 9px 10px; background: var(--black); border: 0; border-bottom: 2px solid var(--blue); color: #fff; margin: 14px 0; font: 600 15px Inter, sans-serif; outline: none; border-radius: 2px }
.box input:focus { border-color: var(--red) }
.box input::placeholder { color: #6f78a8 }
.box button { background: var(--red); border: 0; color: #fff; padding: 10px; width: 100%; font-weight: 600; cursor: pointer; border-radius: 22px 18px 24px 16px; box-shadow: 0 3px 0 #8f1d2c }
.box button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8f1d2c }

/* control panel */
#main-ui { display: none; width: 100%; height: 100%; position: relative }
.topbar { position: absolute; top: 8px; left: 8px; right: 8px; height: 42px; background: var(--panel); border: 1px solid var(--edge); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-radius: 8px 4px 9px 5px }
.tb { background: var(--slip); color: #fff; border: 1px solid var(--edge); padding: 5px 11px; border-radius: 5px 9px 5px 8px; cursor: pointer; margin-left: 6px; font-size: 12px }
.tb:hover { background: #2a3270 }
.tb.red { background: #8f1d2c; border-color: var(--red) }

#chat-sidebar { position: absolute; top: 58px; left: 8px; bottom: 8px; width: 320px; background: var(--panel); border: 1px solid var(--edge); border-radius: 5px 9px 5px 10px; display: flex; flex-direction: column; overflow: hidden }
.chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px }
.chat-msg { background: var(--slip); border-left: 3px solid var(--red); padding: 6px 9px; border-radius: 3px 9px 9px 4px; font-size: 12px; cursor: pointer; word-break: break-word }
.chat-msg:hover { background: #262d5c }

#dropzone { position: absolute; top: 58px; left: 336px; right: 8px; bottom: 8px; border: 2px dashed #34429a; border-radius: 14px 8px 16px 9px / 9px 15px 8px 14px; display: flex; align-items: center; justify-content: center; color: #7d8fd6; font: 28px 'Caveat Brush', cursive }

/* the note that shows up on stream */
#wb-wrap {
  position: fixed; z-index: 9999; pointer-events: none; opacity: 0;
  filter: drop-shadow(3px 7px 6px rgba(0, 0, 0, .6));   /* drop-shadow so the torn edge casts one too */
  transform: rotate(calc(var(--tilt, -1.5deg) + 5deg)) translateY(-18px) scale(1.04);
  transition: opacity .15s, transform .35s cubic-bezier(.2, 1.5, .4, 1);
}
#wb-wrap.active { opacity: 1; transform: rotate(var(--tilt, -1.5deg)); pointer-events: auto }

.wb-inner {
  position: relative;
  color: var(--text);
  padding: 26px 26px 30px;
  background: var(--grain), radial-gradient(ellipse at 18% 8%, rgba(74, 99, 255, .28), transparent 55%), var(--black);
  box-shadow: inset 0 0 30px rgba(0, 0, 0, .7);
}
/* hand-ruled border, wobbled with an svg filter so it isn't perfectly straight */
.wb-inner::after { content: ""; position: absolute; inset: 12px 12px 14px; pointer-events: none; border: 2px solid rgba(74, 99, 255, .8); border-radius: 3px 6px 2px 5px; filter: url(#wobble) }

/* strip of tape on top, ragged at the ends */
.tape {
  position: absolute; top: -13px; left: 50%; width: 114px; height: 28px; margin-left: -57px;
  transform: rotate(var(--tape, -4deg));
  background: var(--grain), rgba(74, 99, 255, .85);
  clip-path: polygon(0 0, 100% 0, 98% 22%, 100% 44%, 98% 66%, 100% 100%, 0 100%, 2% 78%, 0 56%, 2% 34%);
}

.wb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px }
#wb-user { position: relative; font-family: Metamorphous, serif; font-size: 22px }
/* red scribble under the name */
#wb-user::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px; background: var(--red); border-radius: 40% 60% 50% 50% / 100%; transform: rotate(-.8deg) }
.close-x { background: none; border: 1.5px solid var(--blue); color: var(--blue); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font: 600 12px Inter, sans-serif; line-height: 1 }
.obs-mode .close-x { display: none }
.wb-text { font-family: 'Caveat Brush', cursive; font-size: 36px; line-height: 1.12; letter-spacing: .2px; word-break: break-word; max-height: 48vh; overflow: hidden; padding: 0 4px; filter: url(#ink) }
.em { height: 1.1em; vertical-align: -.2em }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="2"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
</svg>

<div id="setup"><div class="box">
  <h3>The Fox's Board</h3>
  <p style="font-size:11px;color:#aaa;margin-top:6px">enter your twitch name (Vixwytch)</p>
  <input id="chan-box" placeholder="vixwytch">
  <button onclick="launch()">Launch</button>
</div></div>

<div id="main-ui">
  <div class="topbar">
    <span style="font-size:12px">ch: <b id="chan-lbl" style="color:#e8334a"></b> &nbsp; obs: <b id="st">waiting</b></span>
    <div><button class="tb" onclick="copyLink()">copy obs link</button><button class="tb red" onclick="clearBoard()">clear</button></div>
  </div>
  <div id="chat-sidebar">
    <div style="padding:8px;font-size:11px;background:#11142a;color:#9fb0f0">chat: click a message, or drag it over</div>
    <div class="chat-list" id="chat-stream"></div>
  </div>
  <div id="dropzone">drop a message here</div>
</div>

<div id="wb-wrap"><div class="wb-inner">
  <div class="wb-head">
    <span id="wb-user"></span>
    <button class="close-x" onclick="clearBoard()">x</button>
  </div>
  <div class="wb-text" id="wb-content"></div>
</div>
<i class="tape"></i>
</div>

<script>
var params = new URLSearchParams(location.search);
var isObs = params.get('obs') === 'true';
var $ = function (id) { return document.getElementById(id) };

function store_(k, v) {
  try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v) } catch (e) { return null }
}
function numParam(name, fallback, min, max) {
  var n = parseFloat(params.get(name));
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

// position etc comes from the obs link: ?x=66&y=18&w=520&hide=15
var posX = numParam('x', 2, 0, 95);
var posY = numParam('y', 14, 0, 90);
var boardW = numParam('w', 430, 200, 1400);
var hideAfter = numParam('hide', 0, 0, 300);   // seconds, 0 = never
var tilt = numParam('tilt', -1.5, -8, 8);

var wrap = $('wb-wrap'), content = $('wb-content');
wrap.style.left = posX + '%';
wrap.style.top = posY + '%';
wrap.style.width = boardW + 'px';
wrap.style.setProperty('--tilt', tilt + 'deg');

var channel = (params.get('channel') || store_('vix_c') || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
var secret = (params.get('k') || '').replace(/[^a-z0-9]/gi, '');

// random string so the peer id can't be guessed
if (!isObs && !secret) {
  secret = store_('vix_k');
  if (!secret) {
    secret = '';
    var rnd = crypto.getRandomValues(new Uint8Array(12));
    for (var i = 0; i < rnd.length; i++) secret += (rnd[i] % 36).toString(36);
    store_('vix_k', secret);
  }
}
function peerId() { return 'vixboard_' + channel + '_' + secret }

// TODO: add more bots when they show up in chat
var botNames = ['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'wizebot'];

// chop the message into text and emote pieces
function splitMsg(msg, emotes) {
  if (!emotes) return [{ t: msg }];
  var spots = [];
  for (var id in emotes) {
    emotes[id].forEach(function (range) {
      var ab = range.split('-').map(Number);
      spots.push([ab[0], ab[1], id]);
    });
  }
  spots.sort(function (a, b) { return a[0] - b[0] });
  var chars = Array.from(msg), out = [], pos = 0;
  spots.forEach(function (s) {
    if (s[0] > pos) out.push({ t: chars.slice(pos, s[0]).join('') });
    out.push({ e: s[2] });
    pos = s[1] + 1;
  });
  if (pos < chars.length) out.push({ t: chars.slice(pos).join('') });
  return out;
}

// textContent only (never innerHTML), chat is untrusted
function fillEl(el, chunks) {
  el.textContent = '';
  chunks.forEach(function (c) {
    if (c.e) {
      if (!/^[\w-]+$/.test(c.e)) return;
      var img = new Image();
      img.className = 'em';
      img.src = 'https://static-cdn.jtvnw.net/emoticons/v2/' + c.e + '/default/dark/2.0';
      el.append(img);
    } else {
      el.append(document.createTextNode(String(c.t).slice(0, 500)));
    }
  });
}

// dark name colors disappear on the board so lighten them
function brighten(c) {
  if (!/^#[0-9a-f]{6}$/i.test(c || '')) return '#e8334a';
  var r = parseInt(c.slice(1, 3), 16) / 255,
      g = parseInt(c.slice(3, 5), 16) / 255,
      b = parseInt(c.slice(5, 7), 16) / 255;
  var light = (Math.max(r, g, b) + Math.min(r, g, b)) / 2;
  if (light >= .62) return c;
  var k = (.62 - light) / (1 - light);
  function hex(v) { return Math.round((v + (1 - v) * k) * 255).toString(16).padStart(2, '0') }
  return '#' + hex(r) + hex(g) + hex(b);
}

var hideTimer;
function shrinkToFit() {
  var size = 36;
  content.style.fontSize = size + 'px';
  while (content.scrollHeight > content.clientHeight && size > 14) {
    size -= 2;
    content.style.fontSize = size + 'px';
  }
}
// random tilt, tape and torn edge every time
function randomizeNote() {
  var rand = function (min, max) { return min + Math.random() * (max - min) };

  wrap.style.setProperty('--tilt', (tilt + rand(-1.3, 1.3)).toFixed(2) + 'deg');
  wrap.style.setProperty('--tape', rand(-7, 7).toFixed(1) + 'deg');

  // clip-path round the edge, bottom is the ragged bit
  var pts = ['0 0', '100% 0'];
  for (var i = 1; i < 4; i++) {
    pts.push(rand(99.3, 100).toFixed(1) + '% ' + (i * 25) + '%');
  }
  for (var j = 0; j <= 16; j++) {
    var x = 100 - j * 6.25 + rand(-1.2, 1.2);
    pts.push(x.toFixed(1) + '% calc(100% - ' + rand(0, 7).toFixed(1) + 'px)');
  }
  for (var k = 3; k > 0; k--) {
    pts.push(rand(0, .7).toFixed(1) + '% ' + (k * 25) + '%');
  }
  wrap.firstElementChild.style.clipPath = 'polygon(' + pts.join(',') + ')';
}
function showBoard(user, chunks, color) {
  var name = $('wb-user');
  name.textContent = user;
  randomizeNote();
  name.style.color = brighten(color);
  fillEl(content, chunks);
  // remove + re-add so the pop animation replays
  wrap.style.transition = 'none';   // no transition for a sec so it snaps back first
  wrap.classList.remove('active');
  void wrap.offsetWidth;
  wrap.style.transition = '';
  wrap.classList.add('active');
  shrinkToFit();
  clearTimeout(hideTimer);
  if (hideAfter) hideTimer = setTimeout(hideBoard, hideAfter * 1000);
}
function hideBoard() { wrap.classList.remove('active') }

// obs side, just waits for the panel
function startObs() {
  var peer = new Peer(peerId());
  peer.on('error', function (e) {
    // old session still holding the id, try again in a few secs
    if (e.type === 'unavailable-id') { peer.destroy(); setTimeout(startObs, 4000); }
  });
  peer.on('disconnected', function () { peer.reconnect() });
  peer.on('connection', function (c) {
    c.on('data', function (d) {
      if (!d || typeof d !== 'object') return;
      if (d.act === 'show' && Array.isArray(d.p)) showBoard(String(d.u).slice(0, 40), d.p.slice(0, 120), d.c);
      if (d.act === 'clear') hideBoard();
    });
  });
}

// control panel
var peer, conn = null, connecting = false;
var saved = new Map(), counter = 0;

function setStatus(ok) {
  $('st').textContent = ok ? 'connected' : 'waiting';
  $('st').style.color = ok ? '#4ade80' : '#fbbf24';
}

function tryConnect() {
  if (connecting || (conn && conn.open)) return;
  connecting = true;
  var c = peer.connect(peerId(), { reliable: true });
  conn = c;
  function dropped() {
    connecting = false;
    if (conn === c) conn = null;
    setStatus(false);
  }
  c.on('open', function () { connecting = false; setStatus(true) });
  c.on('close', dropped);
  c.on('error', dropped);
}

function pickMsg(i) {
  var d = saved.get(i);
  if (!d) return;
  showBoard(d.u, d.ps, d.c);   // preview in the panel too
  if (conn && conn.open) conn.send({ act: 'show', u: d.u, c: d.c, p: d.ps });
}
function clearBoard() {
  hideBoard();
  if (conn && conn.open) conn.send({ act: 'clear' });
}
function copyLink() {
  if (location.protocol === 'file:') {
    alert('Host this page first (GitHub Pages works, or run python -m http.server) so OBS gets a real link.');
    return;
  }
  var u = new URL(location.href);
  u.search = '';
  u.searchParams.set('obs', 'true');
  u.searchParams.set('channel', channel);
  u.searchParams.set('k', secret);
  ['x', 'y', 'w', 'hide', 'tilt'].forEach(function (k) {
    if (params.get(k)) u.searchParams.set(k, params.get(k));
  });
  navigator.clipboard.writeText(u.toString());
  alert('Link copied. In OBS add a Browser source at 1920x1080 and paste it in.');
}

function launch() {
  var v = $('chan-box').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!v) return;
  channel = v;
  store_('vix_c', channel);
  $('setup').style.display = 'none';
  $('main-ui').style.display = 'block';
  $('chan-lbl').textContent = channel;
  setStatus(false);

  var list = $('chat-stream');

  // handles one chat message (same thing tmi.js used to do for us)
  function onChat(tags, msg) {
    var user = tags['display-name'] || tags.username || '?';
    // console.log(tags)   // handy when twitch changes the format
    if (msg.startsWith('!')) return;
    if (botNames.indexOf((tags.username || '').toLowerCase()) > -1) return;

    var col = brighten(tags.color);
    var ps = splitMsg(msg, tags.emotes);
    var i = ++counter;
    saved.set(i, { u: user, c: col, ps: ps });

    var row = document.createElement('div');
    row.className = 'chat-msg';
    row.draggable = true;
    row.dataset.i = i;
    var nameEl = document.createElement('b');
    nameEl.style.color = col;
    nameEl.textContent = user + ': ';
    var textEl = document.createElement('span');
    fillEl(textEl, ps);
    row.append(nameEl, textEl);
    row.onclick = function () { pickMsg(i) };
    row.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(i)) });
    list.append(row);

    // only keep the last 40
    while (list.children.length > 40) {
      saved.delete(+list.firstChild.dataset.i);
      list.removeChild(list.firstChild);
    }
    list.scrollTop = list.scrollHeight;
  }

  // read-only chat over a raw websocket, no login
  function connectChat() {
    var ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = function () {
      ws.send('CAP REQ :twitch.tv/tags');
      ws.send('PASS SCHMOOPIIE');   // anonymous login, any text works
      ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
      ws.send('JOIN #' + channel);
    };
    ws.onmessage = function (ev) {
      ev.data.split('\r\n').forEach(function (line) {
        if (!line) return;
        if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
        if (line.indexOf(' PRIVMSG #') === -1) return;
        var tags = {}, rest = line;
        if (line[0] === '@') {
          var sp = line.indexOf(' ');
          line.slice(1, sp).split(';').forEach(function (kv) {
            var eq = kv.indexOf('=');
            tags[kv.slice(0, eq)] = kv.slice(eq + 1);
          });
          rest = line.slice(sp + 1);
        }
        // rest looks like  :name!name@name.tmi.twitch.tv PRIVMSG #chan :the message
        var m = rest.match(/^:([^!]+)!.* PRIVMSG #\S+ :(.*)$/);
        if (!m) return;
        tags.username = m[1];
        // emotes come as  id:0-4,6-10/id2:12-15  so turn that into {id: ['0-4','6-10']}
        if (tags.emotes) {
          var obj = {};
          tags.emotes.split('/').forEach(function (e) {
            var bits = e.split(':');
            obj[bits[0]] = bits[1].split(',');
          });
          tags.emotes = obj;
        } else {
          tags.emotes = null;
        }
        if (tags.color === '') tags.color = null;
        onChat(tags, m[2]);
      });
    };
    ws.onclose = function () { setTimeout(connectChat, 3000) };   // reconnect if it drops
  }
  connectChat();

  peer = new Peer();
  peer.on('open', function () { tryConnect(); setInterval(tryConnect, 2000) });
  peer.on('error', function () { connecting = false; conn = null; setStatus(false) });
  peer.on('disconnected', function () { peer.reconnect() });

  var dz = $('dropzone');
  dz.ondragover = function (e) { e.preventDefault() };
  dz.ondrop = function (e) {
    e.preventDefault();
    pickMsg(+e.dataTransfer.getData('text/plain'));
  };
}

if (isObs) {
  document.body.classList.add('obs-mode');
  $('setup').style.display = 'none';
  if (channel && secret) startObs();
} else if (channel) {
  $('chan-box').value = channel;
  launch();
}
</script>
</body>
</html>
